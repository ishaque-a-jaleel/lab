apiVersion: v1
kind: Service
metadata:
  name: nexus-service
  namespace: devops-tools
  annotations:
      prometheus.io/scrape: 'true'
      prometheus.io/path:   /
      prometheus.io/port:   '8081'
spec:
  selector: 
    app: nexus-server
  type: NodePort  
  ports:
    - name: admin-portal
      port: 8081
      targetPort: 8081
      nodePort: 30081
    - name: repo
      port: 8082
      targetPort: 8082
      nodePort: 30082