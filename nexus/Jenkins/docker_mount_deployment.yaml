apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: devops-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      securityContext:
        runAsUser: 0  # Run as root user
      containers:
        - name: jenkins
          image: trion/jenkins-docker-client # Pre-configured Jenkins image with Docker
          ports:
            - containerPort: 8080
            - containerPort: 50000
          securityContext:
            privileged: true  # Grant full permissions
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run/docker.sock
            - name: jenkins-data
              mountPath: /var/jenkins_home
      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-pvc
