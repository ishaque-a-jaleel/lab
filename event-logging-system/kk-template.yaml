Resources:
  # DynamoDB Table
  EventLogsTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: EventLogs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: EventID  
          AttributeType: S
      KeySchema:
        - AttributeName: EventID
          KeyType: HASH

