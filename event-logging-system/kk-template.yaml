  # Commenting the below lines since the kodekloud account doesn't have enough permissions to perform the action
  # IAM Role for API Gateway Logging
  # ApiGatewayLoggingRole:
  #   Type: 'AWS::IAM::Role'
  #   Properties:
  #     AssumeRolePolicyDocument:
  #       Version: '2012-10-17'
  #       Statement:
  #         - Effect: Allow
  #           Principal:
  #             Service: apigateway.amazonaws.com
  #           Action: 'sts:AssumeRole'
  #     ManagedPolicyArns:
  #       - 'arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs'

  # Commenting the below lines since the kodekloud account doesn't have enough permissions to perform the action
  # API Gateway Account Settings
  # ApiGatewayAccount:
  #   Type: 'AWS::ApiGateway::Account'
  #   Properties:
  #     CloudWatchRoleArn: !GetAtt ApiGatewayLoggingRole.Arn

  # API Gateway
  EventLoggerAPI:
    Type: 'AWS::ApiGateway::RestApi'
    Properties:
      Name: EventLoggerAPI
      Description: API for logging events

  APIResource:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      RestApiId: !Ref EventLoggerAPI
      ParentId: !GetAtt EventLoggerAPI.RootResourceId
      PathPart: 'log-event'

  APIMethod:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      RestApiId: !Ref EventLoggerAPI
      ResourceId: !Ref APIResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 
          - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations'
          - LambdaArn: arn:aws:lambda:us-east-1:992382386160:function:event-logger

  APIStage:
    Type: 'AWS::ApiGateway::Stage'
    #DependsOn: ApiGatewayAccount  # Ensure account settings are configured first
    Properties:
      DeploymentId: !Ref APIDeployment
      RestApiId: !Ref EventLoggerAPI
      StageName: 'prod'
      # Commenting the below lines since the kodekloud account doesn't have enough permissions to perform the action
      # MethodSettings:
      #   - ResourcePath: '/*'            # Apply to all resources
      #     HttpMethod: '*'               # Apply to all HTTP methods
      #     LoggingLevel: 'ERROR'         # Set logging to ERROR level
      #     MetricsEnabled: true          # Enable CloudWatch metrics

  # API Gateway Deployment
  APIDeployment:
    Type: 'AWS::ApiGateway::Deployment'
    DependsOn: APIMethod
    Properties:
      RestApiId: !Ref EventLoggerAPI

  # Lambda Permission for API Gateway
  LambdaPermission:
    Type: 'AWS::Lambda::Permission'
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: arn:aws:lambda:us-east-1:992382386160:function:event-logger
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EventLoggerAPI}/*'
  
  # SNS Topic for Alarms
  AlarmTopic:
    Type: 'AWS::SNS::Topic'
    Properties:
      DisplayName: 'event-logger-alarm'

  # SNS Topic Subscription
  AlarmSubscription:
    Type: 'AWS::SNS::Subscription'
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: 'email'
      Endpoint: 'ishaque.abdul@urolime.com'

  # CloudWatch Alarm
  ErrorAlarm:
    Type: 'AWS::CloudWatch::Alarm'
    Properties:
      AlarmName: LambdaErrorAlarm
      AlarmDescription: Alert when Lambda errors exceed threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: arn:aws:lambda:us-east-1:992382386160:function:event-logger
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      Statistic: Sum
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  APIEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${EventLoggerAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/log-event'
  DynamoDBTableName:
    Description: Name of created DynamoDB table
    Value: !Ref EventLogsTable
  # LambdaFunctionName:
  #   Description: Name of created Lambda function
  #   Value: !Ref EventLoggerFunction
  SNSTopicARN:
    Description: ARN of SNS Topic for Alarms
    Value: !Ref AlarmTopic